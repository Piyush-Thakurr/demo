<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pineapple's Cafe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <section id ="hero-section">
        <h1>Pineapple's Cafe</h1>
        <p>Welcome to our delicious cafe!</p>

        <div class="banner">

            <div class="slider" style="--quantity: 9;">

                <div class="item" style="--position: 1; --text-color: #ffd166"><img src="images/cookies.jpg" alt="Cookies"><h2>COOKIES</h2></div>
                <div class="item" style="--position: 2; --text-color: #faedcd"><img src="images/muffins.jpg" alt="Muffins"><h2>MUFFINS</h2></div>
                <div class="item" style="--position: 3; --text-color: #f4a261"><img src="images/croissants.jpg" alt="Croissants"><h2>CROISSANTS</h2></div>
                <div class="item" style="--position: 4; --text-color: #ff85a1"><img src="images/donuts.jpg" alt="Donuts"><h2>DONUTS</h2></div>
                <div class="item" style="--position: 5; --text-color: #ffe494"><img src="images/cheesebread.jpg" alt="Cheese Bread"><h2>CHEESE BREAD</h2></div>
                <div class="item" style="--position: 6; --text-color: #a7c957"><img src="images/avacado.jpg" alt="Avacado"><h2>AVACADO TOAST</h2></div>
                <div class="item" style="--position: 7; --text-color: #e9d8a6"><img src="images/sandwich.jpg" alt="Sandwich"><h2>SANDWICH</h2></div>
                <div class="item" style="--position: 8; --text-color: #e63946"><img src="images/vpizza.jpg" alt="Veggie Pizza"><h2>VEGGIE PIZZA</h2></div>
                <div class="item" style="--position: 9; --text-color: #c77dff"><img src="images/acai.jpg" alt="Acai Bowl"><h2>ACAI</h2></div>
                <div class="vase"></div>
            </div>

            <div class="content">
                <h1 data-content="COZY VIBES">COZY VIBES</h1>
                <div class="addons">
                    <h2>BAKED BLISS</h2>
                    <p>"Warm mugs and cozy corners."</p>
        
                </div>
               
            </div>
        </div>
    </section>






    <section id="drinks-section">
    <h2>Thirsty?</h2>
    <p>Explore our cozy selection of drinks for instant refreshment.</p>

    <div class="banner2">
        <div class="product">
            <div class="soda"
            style="--url: url(images/coke2f.png)"></div>

            <div class="soda"
            style="--url: url(images/pepsijpg.jpg)"></div>

            <div class="soda"
            style="--url: url(images/monsterjpg.jpg)"></div>

            <div class="soda"
            style="--url: url(images/sprite.jpg)"></div>

            <div class="soda"
            style="--url: url(images/fanta.jpg)"></div>
        </div>
        </div>
  </section>




</body>
</html>
